{% load static %}
<!doctype html>
<html lang="sl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vzdrževalna dela</title>
    <style>
        :root {
            color-scheme: light dark;
        }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f7f7f7;
            color: #1f2937;
        }
        .card {
            max-width: 760px;
            margin: 24px;
            padding: 28px;
            border-radius: 16px;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        h1 {
            margin: 0 0 12px;
            font-size: 1.8rem;
        }
        p {
            margin: 0 0 12px;
            line-height: 1.6;
            font-size: 1.05rem;
        }
        img {
            width: min(100%, 100px);
            height: auto;
            margin: 18px auto 8px;
            display: block;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Stran je trenutno nedosegljiva.</h1>
        <p>
            Potekajo vzdrževalna dela. Hvala za razumevanje.
        </p>
        <img src="{% static 'images/v-delu.png' %}" alt="Dela v teku">
    </main>
</body>
</html>
